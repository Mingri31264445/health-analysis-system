{% load static %}
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ feature.label }}｜AI智慧面診健康平台</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=34">
</head>
<body>
    {% include "core/system_nav.html" %}
    <main class="system-page">
        <section class="system-panel feature-panel">
            <p class="system-eyebrow">{{ feature.eyebrow }}</p>
            <h1>{{ feature.label }}</h1>
            <p class="system-desc">{{ feature.description }}</p>

            <div class="feature-placeholder">
                <span>下一階段功能頁</span>
                <strong>{{ feature.action }}</strong>
                <p>目前已完成登入與問卷前置檢查，後續可在此加入上傳、分析結果與報告內容。</p>
            </div>

            <div class="form-actions">
                <a href="{% url 'start_analysis' %}" class="system-secondary">返回分析入口</a>
                <a href="{% url 'questionnaire' %}?next={{ request.path }}" class="system-submit">更新健康問卷</a>
            </div>
        </section>
    </main>
    <script src="{% static 'js/main.js' %}?v=34"></script>
</body>
</html>
